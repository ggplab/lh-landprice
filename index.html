  footer { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }

const won = n => Math.round(n).toLocaleString('ko-KR');
const pct = n => (n > 0 ? '+' : '') + n.toFixed(2) + '%';

// 0을 가운데 둔 발산형 구간: 하락은 파랑, 상승은 빨강
const BINS = [
  { max: -5,       color: '#2166ac', label: '-5% 미만' },
  { max: -2,       color: '#67a9cf', label: '-5% ~ -2%' },
  { max: 0,        color: '#d1e5f0', label: '-2% ~ 0%' },
  { max: 2,        color: '#fddbc7', label: '0% ~ 2%' },
  { max: 5,        color: '#ef8a62', label: '2% ~ 5%' },
  { max: Infinity, color: '#b2182b', label: '5% 이상' },
];
const GRAY = '#9ca3af';
const colorOf = d => d.status !== 'ok' ? GRAY : BINS.find(b => d.chg < b.max).color;

// KPI
const valid = DATA.filter(d => d.status === 'ok');
const excluded = DATA.length - valid.length;
const avgPrice = valid.reduce((s, d) => s + d.p26, 0) / valid.length;
const avgChg = valid.reduce((s, d) => s + d.chg, 0) / valid.length;
document.getElementById('k-count').innerHTML = DATA.length.toLocaleString('ko-KR') + '<small>필지</small>';
document.getElementById('k-count-note').textContent = `지도에 찍힌 고유 필지 수 · 통계 제외 ${excluded}필지(회색)`;
document.getElementById('k-price').innerHTML = won(avgPrice) + '<small>원/㎡</small>';
document.getElementById('k-price-note').textContent = `2026 공시지가 정상값 ${valid.length}필지 단순평균`;
document.getElementById('k-chg').textContent = pct(avgChg);
document.getElementById('k-chg-note').textContent = `두 해 값이 모두 정상인 ${valid.length}필지 단순평균`;

// 지도
const map = L.map('map', { preferCanvas: true });
// tile.openstreetmap.org는 Referer 없는 요청(file://로 연 페이지)을 막으므로 OSM France의 HOT 타일을 쓴다
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19, subdomains: 'abc',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>, 타일 <a href="https://www.hotosm.org/">HOT</a> · <a href="https://openstreetmap.fr/">OSM France</a>',
}).addTo(map);

const NOTE = {
  missing: '2026 공시지가 결측 — 통계에서 제외',
  unit: '2026 값이 2025의 1/1000 수준(단위 오기 의심) — 통계에서 제외',
};

const markers = DATA.map(d => {
  const p26 = d.p26 == null ? '-' : won(d.p26) + '원';
  const chg = d.status === 'ok' ? pct(d.chg) : '-';
  const html = `<div class="popup">
    <div class="addr">${d.addr}</div>
    <table>
      <tr><td>2025 공시지가</td><td>${won(d.p25)}원</td></tr>
      <tr><td>2026 공시지가</td><td>${p26}</td></tr>
      <tr><td>변동률</td><td>${chg}</td></tr>
      <tr><td>지목 · 면적</td><td>${d.jimok} · ${d.area.toLocaleString('ko-KR')}㎡</td></tr>
      <tr><td>용도지역</td><td>${d.zone}</td></tr>
    </table>
    ${NOTE[d.status] ? `<div class="warn">${NOTE[d.status]}</div>` : ''}
  </div>`;
  return L.circleMarker([d.lat, d.lng], {
    radius: 6, weight: 1, color: '#374151', opacity: 0.6,
    fillColor: colorOf(d), fillOpacity: 0.9,
  }).bindPopup(html).addTo(map);
});
map.fitBounds(L.featureGroup(markers).getBounds(), { padding: [20, 20] });

// 범례
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<b>변동률 (2025→2026)</b>' +
    BINS.slice().reverse().map(b => `<div><i style="background:${b.color}"></i>${b.label}</div>`).join('') +
    `<div><i style="background:${GRAY}"></i>결측·이상값</div>`;
  return div;
};
legend.addTo(map);
</script>
